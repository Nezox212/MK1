<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet" href="../css/character.css">
    <link rel="stylesheet" href="../css/homeWork.css">
</head>
<body>
<div class="head">
    <a href="../index.html" class="logo">
        <header class="link">MK1</header>
    </a>
    <a href="character.html">
        <div class="link" id="character">CHARACTER</div>
    </a>
    <a href="kameo.html">
        <div class="link" id="cameo">CAMEO</div>
    </a>
    <a href="homework.html">
        <div class="link" id="homeWork"> HOMEWORK</div>
    </a>
</div>














<div class="move_block">
    <div class="container">
        <h3>MOVE BLOCK</h3>
        <div class="inner_move_block">
            <div class="parent_block">
                <div class="child_block"></div>
            </div>
        </div>
    </div>
</div>


<div class="stopwatch">
    <div class="container">
        <h3>STOPWATCH </h3>
        <div class="time">
            <div class="time_block">
                <div class="interval" id="seconds">0</div>
            </div>
        </div>
        <div class="time_buttons">
            <button class="btn" id="start">Start</button>
            <button class="btn" id="stop">Stop</button>
            <button class="btn" id="reset">Reset</button>
        </div>
    </div>
</div>



<h3 class="character_name" >Characters </h3>

<div class="characters">
    <div class="container">
        <div class="characters-list">

        </div>
    </div>
</div>

<div class="converter">
    <div class="container">
        <h3>CONVERTER</h3>
        <div class="inner_converter">
            <div class="som">
                <label for="som">Som</label>
                <input type="number" id="som">
            </div>
            <div class="usd">
                <label for="usd">Usd</label>
                <input type="number" id="usd">
            </div>
            <div class="eur">
                <label for="eur">Eur</label>
                <input type="number" id="eur">
            </div>
        </div>
    </div>
</div>


<div class="card_switcher">
    <div class="container">
        <h3>Card Switcher</h3>
        <div class="inner_card_switcher">
            <button class="btn" id="btn-prev">prev</button>
            <div class="card"></div>
            <button class="btn" id="btn-next">next</button>
        </div>
    </div>
</div>


<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__box">
        <button type="button" class="modal__close" aria-label="Закрыть">×</button>

        <form class="modal__form" id="modalForm" novalidate>
            <h2 class="modal__title" id="modalTitle">Регистрация</h2>
            <p class="modal__sub">Укажите почту и телефон</p>

            <div class="field">
                <label for="gmail_input">Gmail</label>
                <input type="email" id="gmail_input" name="gmail" placeholder="example@gmail.com" autocomplete="email" required>
                <div class="field__error"></div>
            </div>

            <div class="field">
                <label for="phone_input">Телефон</label>
                <input type="tel" id="phone_input" name="phone" value="+996 " autocomplete="tel" inputmode="tel" required>
                <div class="field__error"></div>
            </div>

            <button type="submit" class="modal__submit">Зарегистрироваться</button>
            <p class="modal__msg" aria-live="polite"></p>
        </form>

        <div class="modal__success" hidden>
            <div class="modal__check">✓</div>
            <h3>Готово!</h3>
            <p>Вы успешно зарегистрированы</p>
        </div>
    </div>
</div>

<script src="../js/homeWork.js"></script>
<script src="../js/modal.js"></script>

</body>
</html>
