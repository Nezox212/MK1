<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../css/index.css">
<link rel="stylesheet" href="../css/cameo.css">
    <link rel="stylesheet" href="../css/character.css">
</head>
<body>
<div class="head">
    <a href="../index.html" class="logo">
        <header class="link">MK1</header>
    </a>
    <a href="character.html">
        <div class="link" id="character">CHARACTER</div>
    </a>
    <a href="kameo.html">
        <div class="link" id="cameo">KAMEO</div>
    </a>
    <a href="homework.html">
        <div class="link" id="homeWork"> HOMEWORK</div>
    </a>
</div>
<div class="controls">
    <input type="search" id="fSearch" placeholder="Поиск камео...">
    <div class="chips">
        <button class="chip" id="favOnly">♥ Избранные</button>
    </div>
</div>
<div class="kameos"></div>


<div class="fm" id="kameoModal">
    <div class="fm__box">
        <button class="fm__close" aria-label="Закрыть">×</button>
        <button class="fm__nav fm__prev" aria-label="Предыдущий">‹</button>
        <button class="fm__nav fm__next" aria-label="Следующий">›</button>

        <div class="fm__portrait"></div>

        <div class="fm__body">
            <h2 class="fm__name"></h2>
            <div class="fm__tabs">
                <button class="fm__tab active" data-tab="info">Инфо</button>
                <button class="fm__tab" data-tab="video">Видео</button>
            </div>
            <div class="fm__content"></div>
        </div>
    </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__box">
        <button type="button" class="modal__close" aria-label="Закрыть">×</button>

        <form class="modal__form" id="modalForm" novalidate>
            <h2 class="modal__title" id="modalTitle">Регистрация</h2>
            <p class="modal__sub">Укажите почту и телефон</p>

            <div class="field">
                <label for="gmail_input">Gmail</label>
                <input type="email" id="gmail_input" name="gmail" placeholder="example@gmail.com" autocomplete="email" required>
                <div class="field__error"></div>
            </div>

            <div class="field">
                <label for="phone_input">Телефон</label>
                <input type="tel" id="phone_input" name="phone" value="+996 " autocomplete="tel" inputmode="tel" required>
                <div class="field__error"></div>
            </div>

            <button type="submit" class="modal__submit">Зарегистрироваться</button>
            <p class="modal__msg" aria-live="polite"></p>
        </form>

        <div class="modal__success" hidden>
            <div class="modal__check">✓</div>
            <h3>Готово!</h3>
            <p>Вы успешно зарегистрированы</p>
        </div>
    </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/cameo.js"></script>
<script src="../js/modal.js"></script>
<script src="../js/filters.js"></script>

</body>
</html>
